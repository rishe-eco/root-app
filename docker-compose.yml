# Local Postgres for development. Production runs the same engine alongside
# the other services on the VPS, behind host Nginx for TLS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root_website
    ports:
      - '5432:5432'
    volumes:
      - root_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d root_website']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  root_pgdata:
