# Host Nginx site for the mockup wildcard — journeys build plan J9, PD-9. Install
# to /etc/nginx/sites-available/root-mockup and symlink into sites-enabled, beside
# `root` (root.conf) — see ../README.md, "Staging and mockup domains".
#
# One server, one location, one job: hand every request on
# `<grant-id>.mockup.m-root.com` to the API on loopback, which streams the
# viewer's copy of an uploaded mockup out of its stored zip (routes/mockups.ts).
#
# **What this block deliberately is not.** It is not the portal. Uploaded
# mockups are code Root did not write, running on a sibling subdomain of the
# portal's own registrable domain, so this origin must offer nothing but the
# mockup router: no `/graphql`, no `/upload`, no `/files/`, no `/ask`, no SPA,
# no static root. `location /` below is the only location, and
# securityHeaders.test.ts fails if a second one appears. The API refuses
# everything but mockups on this host *too* (the fence at the top of index.ts) —
# this is the second fence, so that a mistake in either is not enough.

# A mockup page pulls a few dozen small assets at once, so the burst is much
# larger than the portal's; the rate is per address, like root.conf's zones.
limit_req_zone $binary_remote_addr zone=root_mockup:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name *.mockup.m-root.com;

    # HTTP has nothing to serve: a grant id is a credential, and it should never
    # travel in the clear. (Nothing to fall back to, either — the redirect keeps
    # the request off the API entirely.)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.mockup.m-root.com;

    # The wildcard certificate certbot issued by DNS-01 — one certificate for
    # both wildcards, under the name README.md's certbot command gives it.
    ssl_certificate     /etc/letsencrypt/live/m-root-wildcards/fullchain.pem;   # ← see README
    ssl_certificate_key /etc/letsencrypt/live/m-root-wildcards/privkey.pem;

    # A mockup view is read-only: GET and HEAD, no body. A kilobyte is room for
    # any legitimate request and nothing else.
    client_max_body_size 1k;

    # The shared portal snippet (security-headers.conf) is deliberately NOT
    # included here, and no `add_header` is set: the API sends this origin's
    # headers itself — the Content-Security-Policy (frame-ancestors the portal,
    # connect-src 'self', form-action 'none'), Referrer-Policy: no-referrer and
    # nosniff — because they depend on APP_ORIGIN, and a second copy here would
    # produce two Content-Security-Policy headers that browsers intersect. The
    # portal's own policy (frame-ancestors 'none', script-src 'self') would in
    # any case break every mockup it was applied to.

    location / {
        limit_req zone=root_mockup burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # The API's fence reads this to know the request is a mockup at all, and
        # to find the grant id — `$host`, so a client cannot choose it any other
        # way than by choosing the host it connected to.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A client-supplied X-Forwarded-Host would be passed through untouched
        # (nginx only replaces headers it is told to). The API ignores it on
        # purpose, but this origin has no use for it either: blank it.
        proxy_set_header X-Forwarded-Host  "";

        # No cookie goes to the API from this origin, and none comes back: the
        # session cookie is host-only on the portal and never reaches a
        # sibling subdomain; anything else a mockup's own script set for itself
        # is none of the API's business. `Set-Cookie` is hidden as well as
        # never being set, so "no Set-Cookie on any mockup response" holds even
        # if the API grows a bug.
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;

        # Stream it. A mockup asset is written to the client as the zip yields
        # it; buffering a video to a temp file first adds latency for nothing on
        # loopback.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
