# Included at server level *and* inside every location that sets an add_header
# of its own. That repetition is not sloppiness — nginx's add_header is
# replace-not-merge: a location containing any add_header discards every one
# inherited from above. So a single `add_header Cache-Control` in `location /`
# would silently strip the whole set below from index.html, which is the one
# response that most needs them.
#
# frame-ancestors is the header that earns its keep here. The contract detail
# page ends in an e-sign button — precisely the control worth framing a
# signed-in customer into clicking without their seeing what they signed.
# X-Frame-Options repeats it for browsers too old for CSP.
#
# 'unsafe-inline' is granted to styles and nothing else: the admin screens set
# style={{…}} on elements, and CSP counts an inline style attribute as inline
# CSS. Scripts need no exception — Vite emits index.html with an external
# module script and nothing inline, so 'self' holds.
#
# HSTS is deliberately absent, though this *is* the terminator and so is the
# right place for it. It is left out until TLS is actually live, because a
# browser holds you to it for the full max-age and turning the header off does
# not release anyone already carrying it. Add it once certbot has run and you
# are sure the domain will stay on HTTPS:
#
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
# frame-src names what the portal may frame — the opposite direction from
# frame-ancestors and X-Frame-Options above, which say who may frame *us*.
# Those two stay exactly as written: the e-sign button is still the control
# worth protecting from clickjacking, and naming a frame-src changes nothing
# about who is allowed to embed this site. Without a frame-src, CSP falls
# back to default-src 'self' for frames too, which silently blocks the L2
# live-demo viewport (`DemoViewport.tsx`, a same-tab <iframe> at
# `demo.stagingUrl`) the moment it runs behind real Nginx — nowhere in
# development or e2e, which have no Nginx in front of them to enforce this at
# all (defect D-1). The value is exactly the two wildcard hosts PD-8 puts
# every staging site and mockup view under, `*.staging.m-root.com` and
# `*.mockup.m-root.com`, and nothing broader: grep `apps/web/src` for every
# `<iframe>` before touching this line again, and if it still turns up only
# `demo.stagingUrl`, do not add 'self' back in — the portal frames no
# same-origin content of its own, so a same-origin allowance here would be
# unused surface, not a fix for anything. object-src stays 'none' regardless
# of this change — an <embed>/<object> plugin load is a different risk
# (arbitrary Flash/PDF-handler content) that a frame-src allowance has no
# bearing on. child-src is left unset on purpose: an unset child-src falls
# back to frame-src for frames and to script-src for workers, which is
# exactly the split this policy already wants, and naming it explicitly here
# would only duplicate frame-src's host list and be one more place for the
# two to drift apart.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; frame-src https://*.staging.m-root.com https://*.mockup.m-root.com; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
