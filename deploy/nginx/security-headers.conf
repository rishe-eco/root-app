# Included at server level *and* inside every location that sets an add_header
# of its own. That repetition is not sloppiness — nginx's add_header is
# replace-not-merge: a location containing any add_header discards every one
# inherited from above. So a single `add_header Cache-Control` in `location /`
# would silently strip the whole set below from index.html, which is the one
# response that most needs them.
#
# frame-ancestors is the header that earns its keep here. The contract detail
# page ends in an e-sign button — precisely the control worth framing a
# signed-in customer into clicking without their seeing what they signed.
# X-Frame-Options repeats it for browsers too old for CSP.
#
# 'unsafe-inline' is granted to styles and nothing else: the admin screens set
# style={{…}} on elements, and CSP counts an inline style attribute as inline
# CSS. Scripts need no exception — Vite emits index.html with an external
# module script and nothing inline, so 'self' holds.
#
# HSTS is deliberately absent, though this *is* the terminator and so is the
# right place for it. It is left out until TLS is actually live, because a
# browser holds you to it for the full max-age and turning the header off does
# not release anyone already carrying it. Add it once certbot has run and you
# are sure the domain will stay on HTTPS:
#
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
