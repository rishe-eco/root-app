# Host Nginx site for root-app. Install to /etc/nginx/sites-available/root and
# symlink into sites-enabled — see ../README.md.
#
# One server, one origin, two jobs: serve the built SPA off disk, and hand
# /graphql to the API container on loopback.
#
# The single origin is a requirement, not tidiness. The session is an httpOnly
# SameSite=Lax cookie; putting the API on api.example.com would make it
# cross-site, the browser would drop it on every request, and every customer
# would silently appear logged out with no error to explain it. Leave
# VITE_GRAPHQL_URL unset so the client keeps asking for the relative /graphql.

# Caps how fast one address can hit the API. The reason is not really brute
# force — sign-in hashes at bcrypt cost 12, ~250ms — it is that those 250ms are
# a lever: a few hundred concurrent sign-ins pin the CPU and take the site down
# for everyone. Generous on purpose, because an office behind one NAT shares an
# address. 10m holds roughly 160k addresses.
limit_req_zone $binary_remote_addr zone=root_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # ← your domain

    # A symlink to releases/<sha>. release-web.sh swaps it with an atomic
    # rename, so no request ever sees a half-uploaded build. Nginx resolves
    # this per request, so a swap needs no reload.
    root /srv/root/current;
    index index.html;

    # www-data must be able to traverse /srv/root and read the release.
    # 755 on the directories is enough; see ../README.md.

    include /etc/nginx/snippets/root-security-headers.conf;

    # Persian text compresses hard — the fa.json strings are most of the bundle.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/font-woff2;

    client_max_body_size 2m;   # the API caps JSON bodies at 1m; leave headroom

    location /graphql {
        include /etc/nginx/snippets/root-security-headers.conf;

        limit_req zone=root_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # $scheme, not the client's header — this is the terminator, so it is
        # the one server that actually knows. The API reads it through
        # `trust proxy`, which is why TRUST_PROXY_HOPS is 1: this hop, and no
        # other. That number decides what address lands in Signature.ip.
        proxy_set_header X-Forwarded-Proto $scheme;

        # GraphQL replies can be large; buffering them whole adds latency for
        # nothing when the upstream is on loopback.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ---- Files -------------------------------------------------------------
    #
    # Three blocks, and the split between them is the whole security model.
    #
    # `/public-files/` is served off disk with no check at all, so it is
    # aliased at the *public* subdirectory and never at STORAGE_DIR itself.
    # Point it one level higher and every customer's private design becomes a
    # guessable URL. The storage layer puts the visibility in the first path
    # segment precisely so this alias can be exact.
    location /public-files/ {
        alias /srv/root/storage/public/;   # ← must match STORAGE_DIR + /public/

        # The shared snippet is deliberately NOT included here. It is written
        # for our own HTML, and these responses are uploaded documents: they
        # get a stricter policy of their own rather than the app's. Duplicating
        # the include would also emit two Content-Security-Policy headers,
        # which browsers intersect — correct by accident, and confusing to read.
        #
        # `sandbox` with `default-src 'none'` means that even if a file slips
        # through as HTML it can run nothing and reach nothing.
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Keys are uuids under a dated directory. Nothing here is listable and
        # nothing should 403 into a directory index.
        autoindex off;
        try_files $uri =404;
    }

    # Private files. Every one goes through Node, because the answer to "may
    # you read this" is a database question — Nginx cannot answer it, so it is
    # not allowed to try.
    location /files/ {
        # Same reasoning as /public-files/: uploaded bytes, not our markup. The
        # API already sends nosniff, the content type and the caching rules and
        # they pass straight through — this is the one header worth adding on
        # top, and repeating the others would only produce duplicates.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

        limit_req zone=root_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream it. Buffering a 2 MB image to a temp file before sending the
        # first byte adds latency and disk churn for nothing on loopback.
        proxy_buffering off;
    }

    # The upload endpoint, and the only place the body limit is raised. The
    # 26m covers the largest class the API accepts (research PDFs at 25 MB)
    # with room for the multipart envelope; the API still enforces the real
    # per-class limit, which for a design image is 2 MB. Nginx's job here is
    # only to stop something absurd before it reaches Node.
    location = /upload {
        include /etc/nginx/snippets/root-security-headers.conf;
        client_max_body_size 26m;
        limit_req zone=root_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hand the body through as it arrives rather than spooling all of it
        # first — the API caps what it will read, and cannot do that if Nginx
        # has already accepted the whole thing on its behalf.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Vite fingerprints these, so the filename changes whenever the bytes do —
    # and old releases stay on disk, so a stale index.html still resolves.
    location /assets/ {
        include /etc/nginx/snippets/root-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(woff2?|ttf|eot)$ {
        include /etc/nginx/snippets/root-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Client-side routing: /fa/app/contracts/xyz is a real URL to the user and
    # a 404 to the filesystem. index.html itself must never be cached, or a
    # deploy leaves browsers asking for asset names that release no longer has.
    location / {
        include /etc/nginx/snippets/root-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# After `certbot --nginx -d example.com` this block is rewritten to listen on
# 443 with a redirect from 80. Add HSTS to the snippet only once TLS is live
# and you are sure — it is a promise browsers hold you to for its full max-age,
# and you cannot take it back by turning it off.
